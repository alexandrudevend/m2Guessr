<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M2Guesr</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- START SCREEN -->
    <div id="startScreen" class="screen active">
      <div class="center-box">
        <img
          src="pics/logo.jpg"
          alt="M2Guessr Logo"
          class="logo"
          id="gameLogo"
        />
        <h1>M2Guesr</h1>
        <p>
          5 rounds • Find on the minimap where the photo was taken<br />
          Max score per round: 5000 points
        </p>
        <button id="btnStart">Start Game</button>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen">
      <div class="top-bar">
        <div class="progress" id="progressText">Round 1 / 5</div>
        <div class="score-live">
          Total Score: <span id="totalScore">0</span>
        </div>
      </div>

      <div class="game-grid">
        <!-- LEFT: Photo -->
        <div class="panel">
          <h3 id="levelName">Location Photo</h3>
          <div class="image-box">
            <img id="photoImg" alt="Location photo" />
          </div>
        </div>

        <!-- RIGHT: Minimap -->
        <div class="panel minimap-panel">
          <h3>Minimap</h3>
          <p class="instruction">
            Click on the minimap to pinpoint the exact location from the photo
          </p>

          <div class="minimap-container">
            <div class="minimap-wrapper" id="minimapWrapper">
              <img id="mapImg" alt="Minimap" />
            </div>
          </div>

          <div class="zoom-controls">
            <button id="btnZoomIn" title="Zoom In">+</button>
            <button id="btnZoomOut" title="Zoom Out">−</button>
            <button id="btnZoomReset" title="Reset Zoom">Reset</button>
          </div>
        </div>
      </div>

      <div class="status info" id="status">
        Click on the minimap to make your guess.
      </div>

      <div class="controls">
        <button id="btnNext" class="hidden" disabled>Next Round →</button>
      </div>
    </div>

    <!-- FINAL SCREEN -->
    <div id="finalScreen" class="screen">
      <div class="center-box">
        <h2>Game Over!</h2>
        <div class="big-score" id="finalScore">0</div>
        <p id="finalMessage">Well played!</p>
        <button id="btnReplay">Play Again</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
