<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geo Minigame – 5 Runde</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- START SCREEN -->
    <div id="startScreen" class="screen active">
      <div class="center-box">
        <h2>Geo Minigame</h2>
        <p>
          5 runde • Găsește pe minimap locul unde a fost făcută poza<br />
          Scor maxim pe rundă: 5000 puncte
        </p>
        <button id="btnStart">Începe jocul</button>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen">
      <div class="top-bar">
        <div class="progress" id="progressText">Runda 1 / 5</div>
        <div class="score-live">Scor total: <span id="totalScore">0</span></div>
      </div>

      <div class="game-grid">
        <div class="panel photo-box">
          <h3 id="levelName">Poza locației</h3>
          <img id="photoImg" alt="Poza" />
        </div>

        <div class="panel">
          <h3>Minimap – click ca să ghicești</h3>
          <div class="minimap-wrapper" id="minimapWrapper">
            <img id="mapImg" alt="Minimap" />
          </div>
        </div>
      </div>

      <div class="status info" id="status">
        Click pe minimap ca să alegi locul unde crezi că a fost făcută poza.
      </div>

      <div class="controls">
        <button id="btnNext" class="hidden" disabled>Următoarea rundă →</button>
      </div>
    </div>

    <!-- FINAL SCREEN -->
    <div id="finalScreen" class="screen">
      <div class="center-box">
        <h2>Joc terminat!</h2>
        <div class="big-score" id="finalScore">0</div>
        <p id="finalMessage">Felicitări!</p>
        <button id="btnReplay">Joacă din nou</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
